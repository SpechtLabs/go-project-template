version: 2

project_name: PROJECT_NAME

builds:
  - id: PROJECT_NAME
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    binary: PROJECT_NAME
    main: ./cmd/PROJECT_NAME
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      # Only the version is injected; commit, commit time and dirty state come
      # from the VCS info the Go toolchain embeds (see `PROJECT_NAME version`).
      - -X=main.version={{ .Version }}

archives:
  - id: PROJECT_NAME
    ids:
      - PROJECT_NAME
    name_template: "PROJECT_NAME_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# Publish to SpechtLabs/homebrew-tap using HOMEBREW_TAP_GITHUB_TOKEN, a
# repository or organization Actions secret with Contents: read and write
# access to the tap. The default GITHUB_TOKEN only has access to this repo.
homebrew_casks:
  - name: PROJECT_NAME
    ids:
      - PROJECT_NAME
    repository:
      owner: SpechtLabs
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/SpechtLabs/PROJECT_NAME"
    description: "PROJECT_NAME does one thing, and does it well"
    skip_upload: auto
    commit_author:
      name: goreleaser-bot
      email: bot@specht-labs.de
    # PROJECT_NAME is not Apple-notarized. Remove quarantine from the installed
    # binary so Gatekeeper allows it to run, as with the other CLIs in the tap.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/PROJECT_NAME"]
          end

# release-please writes the changelog and creates the GitHub release; GoReleaser
# only attaches the artifacts to it.
changelog:
  disable: true

# A keyless cosign signature over checksums.txt, as a Sigstore bundle, covers
# every archive through its checksum. `artifacts: binary` would sign nothing:
# it only matches binaries released on their own, and ours ship in archives.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum

release:
  github:
    owner: SpechtLabs
    name: PROJECT_NAME
  mode: keep-existing
