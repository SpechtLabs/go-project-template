# Labels for pull requests, by the files they change. Add a label per area as
# the project grows (sigil's labeler.yml has one per compiler stage); keep
# the build label's list in step with the tooling files.

# CLI commands and entrypoint
cli:
  - changed-files:
      - any-glob-to-any-file:
          - "cmd/**"
          - "internal/cli/**"

# Library code other projects can import
go-api:
  - changed-files:
      - any-glob-to-any-file:
          - "pkg/**"

# Tests
tests:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*_test.go"
          - "**/testdata/**"

# Documentation
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"

# The docs site's build: VuePress config, theme and dependencies
docs-site:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/.vuepress/**"
          - "docs/package.json"
          - "docs/bun.lock"

# Build, release, and CI plumbing
build:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - ".goreleaser.yaml"
          - ".release-please-config.json"
          - ".release-please-manifest.json"
          - ".mise.toml"
          - ".golangci.yaml"
          - ".custom-gcl.yml"
          - ".pre-commit-config.yaml"
          - ".markdownlint-cli2.yaml"
          - ".yamllint.yaml"
          - ".editorconfig"
          - "codecov.yml"
          - "renovate.json"
          - "go.mod"
          - "go.sum"

# Add 'enhancement' to any PR whose head branch starts with `feat` or `feature`
enhancement:
  - head-branch:
      - "^feat"
      - "^feature"

# Add 'bug' to any PR whose head branch starts with `fix` or `bug`
bug:
  - head-branch:
      - "^fix"
      - "^bug"
